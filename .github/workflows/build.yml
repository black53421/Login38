name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Everything in this solution is PlatformTarget=x86, including the test projects, so
      # the test host is a 32-bit process and needs the 32-bit desktop runtime. The runner
      # image ships only the x64 one.
      #
      # DOTNET_ROOT_X86 is not optional here. setup-dotnet points DOTNET_ROOT at its x64
      # install, and without the x86 variable the 32-bit host follows it, loads a 64-bit
      # hostfxr.dll and aborts the run with HRESULT 0x800700C1.
      - name: Install the x86 .NET Desktop Runtime
        shell: pwsh
        run: |
          $root = "${env:ProgramFiles(x86)}\dotnet"
          $script = Join-Path $env:RUNNER_TEMP 'dotnet-install.ps1'
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile $script
          & $script -Runtime windowsdesktop -Channel 10.0 -Architecture x86 -InstallDir $root
          "DOTNET_ROOT_X86=$root" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        run: dotnet build Login38.slnx -c Release --nologo

      - name: Test
        run: dotnet test Login38.slnx -c Release --nologo --no-build

      - name: Publish
        shell: pwsh
        run: ./build/publish.ps1 -Zip

      - uses: actions/upload-artifact@v4
        with:
          name: Login38-win-x86
          path: artifacts/release/

      # Tag pushes only. A release built from anything but a tag has no version to be.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
